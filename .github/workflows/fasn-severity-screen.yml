name: FASN GSE230809 severity screen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'run_fasn_severity_screen.py'
      - '.github/workflows/fasn-severity-screen.yml'

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn requests
      - name: Run severity and module screen
        run: |
          set -o pipefail
          python run_fasn_severity_screen.py 2>&1 | tee severity.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fasn-gse230809-severity-results
          path: |
            results_severity/
            severity.log
          if-no-files-found: warn
          retention-days: 7
