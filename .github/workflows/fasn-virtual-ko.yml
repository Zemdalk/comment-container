name: FASN GSE230809 virtual KO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'run_fasn_virtual_ko.py'
      - '.github/workflows/fasn-virtual-ko.yml'

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install "scTenifoldpy==0.4.0" scipy pandas numpy requests
      - name: Run FASN virtual knockout
        run: |
          set -o pipefail
          python run_fasn_virtual_ko.py 2>&1 | tee fasn_knk.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fasn-gse230809-virtual-ko-results
          path: |
            results_fasn_knk/
            fasn_knk.log
          if-no-files-found: warn
          retention-days: 7
